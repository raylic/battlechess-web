<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：让底下的 #0d1117 铺到刘海/圆角区（横屏时刘海在左右两侧）。
         user-scalable=no 在 iOS 10+ 会被忽略（无障碍），真正防误触缩放的是 CSS 的 touch-action。 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1117" />
    <!-- 首帧底色：CSS 文件要到 <head> 末尾才生效，图片更晚。
         这两行保证"还没画出任何东西"时画布已经是黑的 —— 之前是浏览器默认白底，
         加载首页那一瞬间会看到白/黑的闪跳。color-scheme 顺带把表单控件、滚动条也压成暗色。 -->
    <meta name="color-scheme" content="dark" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      /* 关键：竖屏遮罩的标记就在 body 里，而主样式表（dev 下是 JS 注入）可能比它晚到。
         没样式的那一两帧里它会以"裸 SVG"出现 —— color-scheme:dark 把默认文字刷成白色，
         配合黑底就是一个巨大的白色手机图标，也就是首屏那个"黑白图案"。
         这里先把它按死，主样式表到位后由 @media (display-mode:standalone) 那组规则接管。 */
      #rotate {
        display: none;
      }
    </style>

    <!-- 图标统一用 192 那一张：favicon、apple-touch-icon、manifest 全是它 -->
    <link rel="icon" type="image/png" sizes="192x192" href="./assets/icon-192.png" />
    <link rel="apple-touch-icon" href="./assets/icon-192.png" />

    <!-- PWA：可安装（装到主屏 / 桌面后独立窗口打开，且被系统锁成横屏） -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="皇家战棋" />

    <!-- 首帧就要对的两件事：
         ① 舞台缩放 --fit：原来只在 useFitScale 的 useEffect 里写，首帧仍是 1 倍，
            大窗口下会看到舞台"先小一圈再弹开"（闪一帧）。这里在 CSS 生效前先算一次。
            尺寸 1000x650 与 styles.css 里 #app 的宽高是同一对常数。
         ② 两张首屏大图先预载，避免"先黑一下再出图"。 -->
    <script>
      document.documentElement.style.setProperty(
        '--fit',
        String(Math.min(window.innerWidth / 1000, window.innerHeight / 650)),
      );
    </script>
    <link rel="preload" as="image" href="./assets/bg.jpg" />
    <link rel="preload" as="image" href="./assets/begin.webp" />

    <title>皇家战棋 · Web</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- 竖屏遮罩。写在 React 根之外、且显隐完全由 CSS 媒体查询决定，是为了"首帧就对"：
         JS 挂载前、甚至 JS 挂了，竖屏用户看到的也是提示而不是一个缩成 390x253 的棋盘。
         为什么必须有它 —— 见 styles.css 里 #rotate 的注释。 -->
    <div id="rotate" aria-hidden="true">
      <svg viewBox="0 0 120 120" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
        <!-- 竖着的手机 -->
        <rect x="44" y="16" width="32" height="58" rx="9" />
        <line x1="55" y1="25" x2="65" y2="25" />
        <!-- 转到横屏的箭头 -->
        <path d="M26 58a30 30 0 0 0 30 30h30" />
        <path d="M78 80l9 8-9 8" />
      </svg>
      <p>请把手机横过来</p>
      <p class="sub">本作是按横屏（1000×650）画的，竖屏下棋盘会缩得点不准</p>
    </div>

    <!-- 两帧之后才允许竖屏遮罩出现：文档刚解析时 innerWidth/innerHeight 还是 0，
         (orientation: portrait) + (pointer: coarse) 会误判，加载首页时会闪一下那个
         白手机图标。CSS 侧的门在 styles.css 的 @media 里（html.ready #rotate）。 -->
    <script>
      requestAnimationFrame(function () {
        requestAnimationFrame(function () {
          document.documentElement.classList.add('ready');
        });
      });
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
